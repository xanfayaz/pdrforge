name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pdrforge
          POSTGRES_PASSWORD: pdrforge
          POSTGRES_DB: pdrforge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pdrforge -d pdrforge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://pdrforge:pdrforge@localhost:5432/pdrforge?schema=public
      JWT_SECRET: ci-secret
      NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run db:migrate
      - run: npm run build -w @pdrforge/api
      - run: npm run build -w @pdrforge/web

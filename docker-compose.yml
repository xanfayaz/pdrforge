services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pdrforge
      POSTGRES_PASSWORD: pdrforge
      POSTGRES_DB: pdrforge
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pdrforge_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pdrforge -d pdrforge"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      DATABASE_URL: postgresql://pdrforge:pdrforge@postgres:5432/pdrforge?schema=public
      JWT_SECRET: ${JWT_SECRET:-pdrforge-dev-secret-change-me}
      PORT: 4000
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      UPLOAD_DIR: /repo/apps/api/uploads
      ASSETS_DIR: /repo/apps/api/assets
    ports:
      - "4000:4000"
    volumes:
      - api_uploads:/repo/apps/api/uploads
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
    ports:
      - "3000:3000"
    environment:
      API_PROXY_URL: http://api:4000
    depends_on:
      - api

volumes:
  pdrforge_pg:
  api_uploads:
